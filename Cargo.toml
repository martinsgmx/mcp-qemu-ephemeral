[workspace]
resolver = "2"
members = [
    "core",
    "image-manager",
    "recipe",
    "profiles",
    "runner",
    "mcp-server",
    "cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
tracing = { version = "0.1" }
tracing-subscriber = "0.3"
